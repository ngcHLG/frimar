<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIMAR - Acceso Vendedor</title>
  <link rel="icon" type="image/png" href="../icon_regular_small.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="splash" style="z-index: 9999;">
    <div class="splash-content">
      <img src="../icon_regular_small.png" alt="FRIMAR" class="splash-logo">
      <div class="splash-text">
        <div class="splash-title">FRIMAR</div>
        <div class="splash-slogan">Panel de Vendedor</div>
      </div>
    </div>
  </div>

  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="login-card">
      <h3 class="text-center mb-3"><i class="bi bi-person-badge"></i> Vendedor</h3>
      <div id="login-error" class="alert alert-danger py-2 d-none" role="alert"><span id="error-text"></span></div>
      <form id="login-form">
        <div class="mb-3"><label class="form-label">Correo electrónico</label><input type="email" class="form-control" id="email" required></div>
        <div class="mb-3"><label class="form-label">Contraseña</label><input type="password" class="form-control" id="password" required></div>
        <button type="submit" class="btn btn-accent w-100"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="comun.js"></script>
  <script>
    // Asegurar que el fondo de la pantalla de carga se oculte si hay sesión
    (async () => {
      const { data: { session } } = await window.frimarVendedor.auth.getSession();
      if (session) window.location.href = 'index.html';
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('login-error');
      const errorText = document.getElementById('error-text');
      const { data, error } = await window.frimarVendedor.auth.signInWithPassword({ email, password });
      if (error) {
        errorText.textContent = 'Credenciales inválidas.';
        errorDiv.classList.remove('d-none');
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
