<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUAJIRO - Acceso Administrador</title>
  <link rel="icon" type="image/png" href="../icon_regular_small.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-01: #0D111B;
      --c-02: #16202D;
      --c-03: #39546A;
      --c-04: #8A8D91;
      --c-05: #A7D6E8;
      --c-06: #F2F2F2;
      --c-white: #FFFFFF;
    }

    [data-theme="light"] {
      --bg-body: var(--c-06);
      --bg-surface: var(--c-white);
      --text-main: var(--c-01);
      --text-secondary: var(--c-03);
      --border-color: rgba(138, 141, 145, 0.3);
      --accent-btn: var(--c-03);
      --accent-text: var(--c-06);
      --accent-hover: var(--c-02);
    }

    [data-theme="dark"] {
      --bg-body: var(--c-01);
      --bg-surface: var(--c-02);
      --text-main: var(--c-06);
      --text-secondary: var(--c-05);
      --border-color: var(--c-03);
      --accent-btn: var(--c-05);
      --accent-text: var(--c-01);
      --accent-hover: var(--c-06);
    }

    * { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }

    body {
      background-color: var(--bg-body);
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .login-card h3 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btn-accent {
      background-color: var(--accent-btn);
      color: var(--accent-text);
      border: none;
      border-radius: 4px;
      font-weight: 600;
      padding: 0.6rem 1rem;
      transition: background-color 0.2s ease;
    }
    .btn-accent:hover {
      background-color: var(--accent-hover);
      color: var(--accent-text);
    }

    .form-control {
      background-color: var(--bg-body);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
    .form-control:focus {
      background-color: var(--bg-body);
      color: var(--text-main);
      border-color: var(--accent-btn);
      box-shadow: 0 0 0 0.2rem rgba(167, 214, 232, 0.25);
    }
    .form-control::placeholder { color: var(--c-04); }

    .form-label { color: var(--text-secondary); font-weight: 500; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <img src="../icon_regular_small.png" alt="GUAJIRO" style="height: 48px; width: 48px; object-fit: contain; margin-bottom: 0.5rem;">
      <h3 class="mb-1">GUAJIRO</h3>
      <p class="text-secondary mb-0" style="color: var(--text-secondary);">Panel de administración</p>
    </div>

    <div id="login-error" class="alert alert-danger py-2 d-none" role="alert">
      <span id="error-text"></span>
    </div>

    <form id="login-form">
      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-accent w-100 mt-2">
        <i class="bi bi-box-arrow-in-right"></i> Acceder
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const SUPABASE_URL = 'https://xntjoyqwxqmjfdltydol.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_j1aIGvPLNaTTAbvlygmqzQ_-mCoDRBY';

    // MISMA storageKey que admin/comun.js — si no coinciden, el login
    // "funciona" pero index.html nunca encuentra la sesión.
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        storageKey: 'sb-guajiro-admin-auth-token'
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('login-error');
      const errorText = document.getElementById('error-text');

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorText.textContent = 'Credenciales inválidas. Verifique los datos.';
        errorDiv.classList.remove('d-none');
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
