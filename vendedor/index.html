<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIMAR - Panel Vendedor</title>
  <link rel="icon" type="image/png" href="../icon_regular_small.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css?v=2.0">
</head>
<body>
  <!-- Navegación -->
  <nav class="navbar navbar-dark sticky-top py-3">
    <div class="container justify-content-between">
      <a class="navbar-brand d-flex align-items-center" href="#"><img src="../icon_regular_small.png" alt="FRIMAR" style="height:30px;width:30px;object-fit:contain;margin-right:0.5rem;">FRIMAR</a>
      <button class="btn btn-outline-accent btn-sm" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Salir</button>
    </div>
  </nav>

  <!-- Pestañas -->
  <div class="admin-tabs">
    <div class="container d-flex gap-3">
      <button class="tab-btn active" data-tab="punto-venta">Punto de venta</button>
      <button class="tab-btn" data-tab="pedidos">Pedidos</button>
    </div>
  </div>

  <main class="container my-4" id="main-content"></main>

  <!-- Elementos del cliente (ocultos) necesarios para que cliente.js no falle -->
  <div style="display: none;">
    <div class="fab-container">
      <button id="btn-currency-toggle" class="fab-btn"><span id="current-currency-label">CUP</span></button>
      <button id="btn-theme-toggle" class="fab-btn"><i id="theme-icon"></i></button>
      <button id="btn-cart-fab" class="fab-btn"><span id="cart-badge">0</span></button>
    </div>
    <div class="moneda-list" id="moneda-list"></div>
  </div>

  <!-- Modal de cobro -->
  <div class="modal fade" id="cobroModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Cobrar pedido</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">Nombre del cliente (opcional)</label><input type="text" class="form-control" id="cobro-nombre" placeholder="Cliente de tienda"></div>
          <div class="mb-3"><label class="form-label">Método de pago</label><select class="form-select" id="cobro-metodo"><option value="efectivo">Efectivo</option><option value="transferencia">Transferencia</option></select></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-accent btn-sm" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-accent btn-sm" id="btn-cobrar">Cobrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast de éxito (venta en tienda) -->
  <div aria-live="polite" aria-atomic="true" style="position: fixed; bottom: 20px; left: 20px; right: 20px; z-index: 1060; display: flex; justify-content: center; pointer-events: none;">
    <div id="toastPedido" class="toast align-items-center" role="alert" data-bs-delay="4000" style="width: auto; max-width: 90vw; min-width: 280px; pointer-events: auto; background-color: rgba(20,20,20,0.75); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2); border-radius: 0.8rem; color: #fff;">
      <div class="d-flex align-items-center" style="padding: 1rem;">
        <img src="../icon_regular_small.png" alt="FRIMAR" style="height: 28px; width: 28px; object-fit: contain; margin-right: 0.75rem; flex-shrink: 0;">
        <div style="flex: 1 1 auto; min-width: 0; overflow: hidden;">
          <div style="font-weight: bold; font-size: 1rem; color: #ffffff;">Pedido cobrado</div>
          <div style="font-size: 0.85rem; color: #FCE029;">Venta en tienda</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 1. Librerías CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 2. comun.js del vendedor (crea vendedorSupabase) -->
  <script src="comun.js"></script>

  <!-- 3. Scripts del cliente original -->
  <script src="../js/config.js?v=2.0"></script>
  <script src="../js/cliente.js?v=2.0"></script>
  <script src="../js/carrito.js?v=2.0"></script>

  <!-- 4. Adaptación para el vendedor -->
  <script src="sobrescribir.js"></script>

  <!-- 5. Lógica de cobro y pedidos -->
  <script src="pedido.js"></script>
  <script src="pedidos.js"></script>

  <!-- 6. Control de pestañas -->
  <script>
    const tabs = document.querySelectorAll('.tab-btn');
    const main = document.getElementById('main-content');
    let intervalPedidos = null;

    async function cargarSeccion(tab) {
      const id = tab.dataset.tab;
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      main.innerHTML = '';

      if (intervalPedidos) { clearInterval(intervalPedidos); intervalPedidos = null; }

      if (id === 'punto-venta') {
        await cargarMonedas();           // versión sobrescrita
        await cargarConfiguracion();
        await cargarCategorias();
        await cargarProductos();
        await verificarCombosActivos();
        await cargarRepartosEnvio();
        renderCategorias();
        await verificarHorario();
        renderProductos();
        // El botón de pago y ocultación de secciones ya los maneja sobrescribir.js
      } else if (id === 'pedidos') {
        window.pedidos.init(main);
        intervalPedidos = setInterval(() => window.pedidos.init(main), 30000);
      }
    }

    tabs.forEach(tab => tab.addEventListener('click', () => cargarSeccion(tab)));
    cargarSeccion(document.querySelector('[data-tab="punto-venta"]'));
  </script>
</body>
</html>
