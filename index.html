<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIMAR - Productos Congelados</title>

  <link rel="icon" type="image/png" href="icon_regular_small.png">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Navegación -->
  <nav class="navbar navbar-dark sticky-top py-3">
    <div class="container justify-content-center">
      <a class="navbar-brand d-flex align-items-center m-0" href="#">
        <img src="icon_regular_small.png" alt="GUAJIRO" style="height: 30px; width: 30px; object-fit: contain; margin-right: 0.5rem;">
        FRIMAR
      </a>
    </div>
  </nav>

  <!-- Categorías -->
  <div class="categorias-nav" id="categorias-nav">
    <div class="container" id="categorias-container">
      <span class="skeleton skeleton-chip"></span>
      <span class="skeleton skeleton-chip"></span>
      <span class="skeleton skeleton-chip"></span>
    </div>
  </div>

  <!-- Aviso de horario -->
  <div id="horario-aviso" class="alert alert-secondary text-center mb-0 d-none rounded-0 border-0 border-bottom" role="alert">
    <i class="bi bi-clock"></i> Fuera de servicio. <span id="horario-texto"></span>
  </div>

  <!-- Contenedor Principal -->
  <main class="container my-5">
    <h2 class="mb-4 d-flex align-items-center gap-2">
      <i class="bi bi-box-seam text-secondary"></i> Catálogo de Productos
    </h2>
    <div id="productos-container" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
      <div class="col"><div class="skeleton skeleton-card"></div></div>
      <div class="col"><div class="skeleton skeleton-card"></div></div>
      <div class="col"><div class="skeleton skeleton-card"></div></div>
      <div class="col"><div class="skeleton skeleton-card"></div></div>
    </div>
  </main>

  <!-- FABs -->
  <div class="fab-container">
    <button id="btn-currency-toggle" class="fab-btn" aria-label="Cambiar moneda" title="Cambiar moneda">
      <span id="current-currency-label" style="font-size: 0.9rem; font-weight: bold;">CUP</span>
    </button>
    <button id="btn-theme-toggle" class="fab-btn" aria-label="Alternar Tema">
      <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
    </button>
    <button id="btn-cart-fab" class="fab-btn" data-bs-toggle="offcanvas" data-bs-target="#carritoOffcanvas" aria-label="Ver Carrito">
      <i class="bi bi-cart3"></i>
      <span id="cart-badge">0</span>
    </button>
  </div>

  <!-- Lista de monedas -->
  <div class="moneda-list" id="moneda-list"></div>

  <!-- Offcanvas Carrito -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="carritoOffcanvas">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title"><i class="bi bi-receipt"></i> Orden Actual</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div id="carrito-lista" class="list-group mb-3 flex-grow-1 overflow-auto" style="max-height: calc(100vh - 380px); min-height: 200px;"></div>

      <div class="mt-auto">
        <div class="mb-3 d-none" id="metodo-pago-container">
          <label class="form-label fw-bold">Método de pago</label>
          <select id="metodo-pago" class="form-select" onchange="actualizarCarrito()">
            <option value="efectivo">Efectivo</option>
            <option value="transferencia">Transferencia</option>
          </select>
          <small id="recargo-info" class="text-muted mt-1 d-none"></small>
        </div>

        <div class="mb-3" id="reparto-container">
          <label class="form-label fw-bold">Reparto</label>
          <input type="text" class="form-control" list="repartos-list" id="reparto-input" placeholder="Buscar reparto..." onchange="seleccionarReparto(this.value)">
          <datalist id="repartos-list"></datalist>
          <small id="reparto-precio" class="text-muted"></small>
        </div>

        <div class="bg-body p-3 rounded border">
          <div class="d-flex justify-content-between text-muted mb-1">
            <span>Subtotal:</span>
            <span><span id="subtotal-carrito">0.00</span> <span id="subtotal-moneda">CUP</span></span>
          </div>
          <div id="recargo-desglose" class="d-flex justify-content-between text-muted mb-1 d-none">
            <span>Recargo:</span>
            <span><span id="recargo-aplicado">0.00</span> <span id="recargo-moneda">CUP</span></span>
          </div>
          <div id="envio-desglose" class="d-flex justify-content-between text-muted mb-2 d-none">
            <span>Envío:</span>
            <span><span id="envio-aplicado">0.00</span> <span id="envio-moneda">CUP</span></span>
          </div>
          <div id="envio-cup-desglose" class="d-flex justify-content-between text-muted mb-2 d-none">
            <span>Envío (CUP):</span>
            <span><span id="envio-cup-aplicado">0.00</span> CUP</span>
          </div>
          <div class="d-flex justify-content-between fw-bold fs-5 border-top border-secondary pt-2 mt-2">
            <span>Total:</span>
            <span><span id="total-pedido">0.00</span> <span id="total-moneda">CUP</span></span>
          </div>
        </div>

        <button id="btn-checkout" class="btn btn-accent w-100 mt-3 py-2" disabled>
          Proceder al Pago
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Checkout -->
  <div class="modal fade" id="checkoutModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Datos de Facturación</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="checkout-error" class="alert alert-danger py-2 d-none" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span id="error-text"></span>
          </div>
          <form id="checkout-form">
            <div class="mb-3">
              <label class="form-label">Nombre del Titular</label>
              <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Teléfono de Contacto</label>
              <input type="tel" class="form-control" id="telefono" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Dirección de Entrega</label>
              <textarea class="form-control" id="direccion" rows="2" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Referencia <small class="text-muted">(Opcional)</small></label>
              <textarea class="form-control" id="referencia" rows="1"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-accent" id="confirmar-pedido">Confirmar Transacción</button>
        </div>
      </div>
    </div>
  </div>

    <!-- Contenedor Toasts -->
  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index: 1060">
    <div id="toastPedido" class="toast align-items-center" role="alert" data-bs-delay="4000">
      <div class="d-flex">
        <div class="toast-body d-flex align-items-center gap-2">
          <img src="icon_regular_small.png" alt="GUAJIRO" style="height: 28px; width: 28px; object-fit: contain;">
          <div>
            <strong>Pedido realizado con éxito</strong><br>
            <small class="text-muted">¡GRACIAS POR CONTAR CON NOSOTROS!</small>
          </div>
        </div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- Scripts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Scripts propios (en orden) -->
  <script src="js/config.js"></script>
  <script src="js/cliente.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/pedido.js"></script>
  <script src="js/app.js"></script>
</body>
  </html>
