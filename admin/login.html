<!DOCTYPE html>
<html lang="es" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FRIMAR - Acceso Administrador</title><link rel="icon" type="image/svg+xml" href="../icon_silueta.svg"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Comfortaa:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/branding.css?v=1.0"><style>:root{--c-01:#2B0A14;--c-02:#3A2720;--c-04:#8A8D91;--c-06:#F2F2F2;--c-white:#FFFFFF;--frimar-verde:#77901D;--frimar-burdeos:#2B0A14;--frimar-naranja:#E87003;--frimar-marron:#924B02;--frimar-dark-bg:#16100D;--frimar-dark-surface:#241B17}[data-theme="light"]{--bg-body:var(--c-06);--bg-surface:var(--c-white);--text-main:var(--c-01);--text-secondary:var(--frimar-marron);--border-color:rgba(138,141,145,.3);--accent-btn:var(--frimar-verde);--accent-text:var(--c-06);--accent-hover:var(--frimar-marron)}[data-theme="dark"]{--bg-body:var(--frimar-dark-bg);--bg-surface:var(--frimar-dark-surface);--text-main:var(--c-06);--text-secondary:var(--frimar-naranja);--border-color:rgba(138,141,145,.25);--accent-btn:var(--frimar-marron);--accent-text:var(--c-06);--accent-hover:var(--frimar-naranja)}*{transition:background-color .3s ease,color .3s ease,border-color .3s ease}body{background-color:var(--bg-body);font-family:'Poppins',sans-serif;font-weight:300;color:var(--text-main);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.login-card{background-color:var(--bg-surface);border:1px solid var(--border-color);border-radius:8px;padding:2.5rem 2rem;width:100%;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.08)}.login-card h3{font-family:'Comfortaa',sans-serif;font-weight:700;color:var(--text-main);letter-spacing:1px}.login-brand{width:min(300px,82%);height:auto;margin:0 auto .8rem;display:block}.btn-accent{background-color:var(--accent-btn);color:var(--accent-text);border:none;border-radius:4px;font-weight:600;padding:.6rem 1rem}.btn-accent:hover{background-color:var(--accent-hover);color:var(--accent-text)}.form-control{background-color:var(--bg-body);color:var(--text-main);border:1px solid var(--border-color);border-radius:4px}.form-control:focus{background-color:var(--bg-body);color:var(--text-main);border-color:var(--accent-btn);box-shadow:0 0 0 .2rem rgba(119,144,29,.25)}.form-control::placeholder{color:var(--c-04)}.form-label{color:var(--text-secondary);font-weight:500}</style></head>
<body><div class="login-card"><div class="text-center mb-4"><img src="../logo_frimar.svg" alt="frimar — Sabor a Mi" class="login-brand"><p class="text-secondary mb-0" style="color:var(--text-secondary)">Panel de administración</p></div><div id="login-error" class="alert alert-danger py-2 d-none" role="alert"><span id="error-text"></span></div><form id="login-form"><div class="mb-3"><label class="form-label">Correo electrónico</label><input type="email" class="form-control" id="email" required></div><div class="mb-3"><label class="form-label">Contraseña</label><input type="password" class="form-control" id="password" required></div><button type="submit" class="btn btn-accent w-100 mt-2"><i class="bi bi-box-arrow-in-right"></i> Acceder</button></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script>const SUPABASE_URL='https://xntjoyqwxqmjfdltydol.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_j1aIGvPLNaTTAbvlygmqzQ_-mCoDRBY';const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storageKey:'sb-guajiro-admin-auth-token'}});const errorDiv=document.getElementById('login-error'),errorText=document.getElementById('error-text');const params=new URLSearchParams(window.location.search);if(params.get('error')==='rol'){errorText.textContent='Esta cuenta no tiene permisos de administrador.';errorDiv.classList.remove('d-none')}document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value,password=document.getElementById('password').value;const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){errorText.textContent='Credenciales inválidas. Verifique los datos.';errorDiv.classList.remove('d-none');return}const rol=data.session?.user?.user_metadata?.rol;if(rol!=='admin'){await supabaseClient.auth.signOut();errorText.textContent='Esta cuenta no tiene permisos de administrador.';errorDiv.classList.remove('d-none');return}window.location.href='index.html'});</script></body></html>
