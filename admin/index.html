<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIMAR - Administración</title>
  <link rel="icon" type="image/svg+xml" href="../icon_silueta.svg">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Comfortaa:wght@600;700&display=swap" rel="stylesheet">

  <!-- Estilos específicos del panel de administración -->
  <link rel="stylesheet" href="css/admin.css?v=3.0">
</head>
<body>
  <nav class="navbar navbar-dark navbar-admin py-2">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center m-0" href="#">
        <img src="../icon_silueta.svg" alt="FRIMAR" style="height: 28px; width: 28px; object-fit: contain; margin-right: 0.5rem;">
        FRIMAR
      </a>
      <button class="btn btn-sm btn-nav-logout" onclick="cerrarSesion()" title="Salir" aria-label="Salir">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </nav>

  <div class="admin-tabs">
    <div class="container" id="tabs-container"></div>
  </div>

  <main class="container my-4" id="admin-content"></main>

  <div class="fab-container">
    <button class="fab-btn" id="fab-add" title="Agregar nuevo">
      <i class="bi bi-plus-lg"></i>
    </button>
    <button class="fab-btn" id="btn-theme-toggle" aria-label="Alternar tema">
      <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="comun.js?v=1.2"></script>
  <script>
    // ── Alto real del navbar (evita solapamientos con elementos sticky) ──
    function ajustarAlturaNavbar() {
      const navbar = document.querySelector('.navbar');
      if (navbar) {
        document.documentElement.style.setProperty('--navbar-height', navbar.offsetHeight + 'px');
      }
    }
    ajustarAlturaNavbar();
    window.addEventListener('resize', ajustarAlturaNavbar);

    // ── Tema con persistencia ──
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('theme-icon').className = theme === 'light' ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
      localStorage.setItem('frimar-admin-theme', theme);
    }

    const savedTheme = localStorage.getItem('frimar-admin-theme') || 'light';
    applyTheme(savedTheme);

    document.getElementById('btn-theme-toggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      applyTheme(current === 'light' ? 'dark' : 'light');
    });

    // ── Tabs ──
    const sections = [
      { id: 'categorias', label: 'Categorías', file: 'secciones/categorias.js', fab: true },
      { id: 'productos',  label: 'Productos',  file: 'secciones/productos.js', fab: true },
      { id: 'combos',     label: 'Combos',     file: 'secciones/combos.js', fab: true },
      { id: 'inventario', label: 'Inventario', file: 'secciones/inventario.js', fab: false },
      { id: 'horarios',   label: 'Horarios',   file: 'secciones/horarios.js', fab: false },
      { id: 'zonas',      label: 'Zonas',      file: 'secciones/zonas.js', fab: true },
      { id: 'pedidos',    label: 'Pedidos',    file: 'secciones/pedidos.js', fab: false },
      { id: 'finanzas',   label: 'Finanzas',   file: 'secciones/finanzas.js', fab: false },
      { id: 'config',     label: 'Ajustes',    file: 'secciones/config.js', fab: true }
    ];

    let currentSectionId = null;

    function renderTabs() {
      const container = document.getElementById('tabs-container');
      container.innerHTML = sections.map(s => 
        `<button class="tab-btn" data-id="${s.id}">${s.label}</button>`
      ).join('');
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          loadSection(id);
        });
      });
    }

    async function loadSection(id) {
      const section = sections.find(s => s.id === id);
      if (!section) return;

      if (currentSectionId && currentSectionId !== id && typeof window[currentSectionId]?.destroy === 'function') {
        window[currentSectionId].destroy();
      }

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.querySelector(`.tab-btn[data-id="${id}"]`);
      if (activeBtn) activeBtn.classList.add('active');

      document.getElementById('fab-add').style.display = section.fab ? 'flex' : 'none';

      if (!window.loadedSections) window.loadedSections = {};
      if (!window.loadedSections[id]) {
        try {
          await import('./' + section.file);
          window.loadedSections[id] = true;
        } catch (e) {
          console.error('Error al cargar sección:', e);
          document.getElementById('admin-content').innerHTML = '<p class="text-muted">Error al cargar la sección</p>';
          return;
        }
      }

      const container = document.getElementById('admin-content');
      container.innerHTML = '';
      if (typeof window[id]?.init === 'function') {
        window[id].init(container);
        currentSectionId = id;
      } else {
        container.innerHTML = '<p class="text-muted">Sección no disponible</p>';
      }
    }

    document.getElementById('fab-add').addEventListener('click', () => {
      if (currentSectionId && window[currentSectionId]?.abrirNuevo) {
        window[currentSectionId].abrirNuevo();
      }
    });

    renderTabs();
    loadSection('categorias');
  </script>
</body>
</html>
